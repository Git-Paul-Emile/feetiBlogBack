services:
  - type: web
    name: feeti-blog-backend
    runtime: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate:deploy && npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: ADMIN_REGISTRATION_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FRONTEND_BASE_URL
        value: https://feetiblogfront.vercel.app
      - key: CORS_ORIGINS
        value: https://feetiblogfront.vercel.app
